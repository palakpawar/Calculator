<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator">
        <!-- Header -->
        <div class="calculator-header">
            <div>
                <h1>Calculator</h1>
            </div>
            <div>
                <button id="theme-btn" onclick="toggleTheme()">🌙</button>
            </div>
        </div>
        <!-- Display -->
        <div class="display">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>
        <!-- Buttons -->
        <div class="buttons">
            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="delete">⌫</button>
            <button class="operator" data-operation="%"><b>%</b></button>
            <button class="operator" data-operation="/">➗</button>
            <button data-number="7">7️</button>
            <button data-number="8">8️</button>
            <button data-number="9">9️</button>
            <button class="operator" data-operation="*">✖️</button>
            <button data-number="4">4️</button>
            <button data-number="5">5️</button>
            <button data-number="6">6️</button>
            <button class="operator" data-operation="-">➖</button>
            <button data-number="1">1️</button>
            <button data-number="2">2️</button>
            <button data-number="3">3️</button>
            <button class="operator" data-operation="+">➕</button>
            <button class="zero" data-number="0">0️</button>
            <button data-number=".">.</button>
            <button class="equals" data-action="equals">🟰</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
